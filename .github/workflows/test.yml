name: Test
on:
  push:
    branches-ignore:
      - main
      - develop
jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.25'
        check-latest: true

    - name: Build
      run: go build -v cmd/
    
    - name: Test
      run: go test ./...
