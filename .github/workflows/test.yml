name: Test
on:
  push:
    branches-ignore:
      - main
      - develop
jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version: '1.25'
        check-latest: true

    - name: Build
      run: go build -v cmd/
    
    - name: Test
      run: go test ./...
